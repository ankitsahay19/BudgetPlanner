<div class="d-flex align-items-center top-date-picker">
    <div class="me-2 text-muted small">Year</div>
    <div class="d-flex align-items-center me-3">
        <button class="btn btn-sm btn-outline-secondary me-1" (click)="prevYear()"
            aria-label="Previous year">&lt;</button>
        <div class="px-2 fw-bold">{{ year() }}</div>
        <button class="btn btn-sm btn-outline-secondary ms-1" (click)="nextYear()" aria-label="Next year">&gt;</button>
    </div>

    <div class="me-2 text-muted small">Month</div>
    <div class="d-flex align-items-center">
        <button class="btn btn-sm btn-outline-secondary me-1" (click)="prevMonth()"
            aria-label="Previous month">&lt;</button>
        <div class="px-2 fw-bold">{{ monthName() }} </div>
        <button class="btn btn-sm btn-outline-secondary ms-1" (click)="nextMonth()"
            aria-label="Next month">&gt;</button>
    </div>
</div>
