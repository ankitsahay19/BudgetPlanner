version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: postgres-1
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: postgres
    ports:
      - "3006:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
